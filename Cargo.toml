[workspace]
resolver = "3"
members = ["crates/lodka", "crates/lodka-guest", "crates/lodka-proto"]
default-members = ["crates/lodka", "crates/lodka-proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["vladkens"]
license = "MIT"
repository = "https://github.com/vladkens/lodka"

[profile.release]
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
